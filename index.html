<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コミュニケーションボード</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
</head>

<body>


    <button id="settingsBtn" class="settings-btn"><span class="material-icons">settings</span></button>

    <div class="container">
        <div class="input-area">
            <button id="clearBtn" class="control-btn clear-btn square-btn"><span class="material-icons">delete</span></button>
            <textarea id="textOutput" readonly placeholder="ここに入力された文字が表示されます"></textarea>
            <button id="speakBtn" class="control-btn speak-btn square-btn"><span class="material-icons">chat_bubble</span></button>
        </div>

        <div class="keyboard-area">
            <div class="gojuon-grid" id="gojuonGrid"></div>
        </div>
    </div>

    <!-- 設定モーダル -->
    <div id="settingsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>設定</h2>
                <button class="close-btn" id="closeSettings"><span class="material-icons">close</span></button>
            </div>
            <div class="modal-body">
                <div class="setting-item">
                    <label>音声の種類</label>
                    <div class="control-group">
                        <select id="voiceSelect"
                            style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                            <option value="">（読み込み中...）</option>
                        </select>
                    </div>
                </div>

                <!-- ── 視線入力エンジン（新） ── -->
                <div class="setting-section-header">視線入力エンジン</div>

                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="gazeEngineEnabled">
                        視線入力安定化を有効にする
                    </label>
                </div>
                <div class="setting-item">
                    <label for="gazeDwellTime">停留時間 (ms):</label>
                    <input type="number" id="gazeDwellTime" min="300" max="5000" step="100" value="1000">
                    <span class="setting-value" id="gazeDwellTimeValue">1000ms</span>
                </div>
                <div class="setting-item">
                    <label for="gazeCandidateTime">候補確定時間 (ms):</label>
                    <input type="number" id="gazeCandidateTime" min="50" max="1000" step="50" value="200">
                    <span class="setting-value" id="gazeCandidateTimeValue">200ms</span>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="gazeShowCursor" checked>
                        仮想カーソルを表示する
                    </label>
                </div>
                <div class="setting-item">
                    <label>
                        <input type="checkbox" id="gazeShowDebug">
                        デバッグ表示
                    </label>
                </div>

            </div>
            <div class="modal-footer">
                <button id="saveSettings" class="control-btn speak-btn">保存</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="gaze-engine.js"></script>
</body>

</html>
